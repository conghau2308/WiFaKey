[package]
name = "wifakey_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = "0.32"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
sha2 = "0.10"
zeroize = "=1.6.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
ort = { version = "=2.0.0-rc.13", features = ["ndarray"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_Foundation"] }
